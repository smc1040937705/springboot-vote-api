spring:
  application:
    name: vote-api
  datasource:
    url: jdbc:h2:mem:votedb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

logging:
  level:
    com.example.vote: DEBUG
